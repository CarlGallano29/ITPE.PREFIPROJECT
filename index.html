<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Login Clone</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Helvetica, Arial, sans-serif;
  }
  
  body {
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  
  .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 80%;
    max-width: 1000px;
  }
  
  .left {
    flex: 1;
    margin-right: 50px;
  }
  
  .left h1 {
    color: #1877f2;
    font-size: 60px;
    font-weight: bold;
  }
  
  .left p {
    font-size: 24px;
    color: #1c1e21;
    margin-top: 10px;
  }
  
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .login-box {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  
  .login-box input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 16px;
  }
  
  .login-btn {
    width: 100%;
    padding: 14px;
    background: #1877f2;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }
  
  .login-btn:hover {
    background: #166fe5;
  }
  
  .forgot {
    display: block;
    color: #1877f2;
    margin: 10px 0;
    text-decoration: none;
    font-size: 14px;
  }
  
  hr {
    border: none;
    height: 1px;
    background: #ddd;
    margin: 20px 0;
  }
  
  .create-btn {
    background: #42b72a;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  
  .create-btn:hover {
    background: #36a420;
  }
  
  .footer-text {
    margin-top: 20px;
    font-size: 14px;
  }
  
  .footer-text a {
    font-weight: bold;
    color: black;
    text-decoration: none;
  }
  
  @media (max-width: 768px) {
    .container {
      flex-direction: column;
      text-align: center;
    }
    .left {
      margin-right: 0;
      margin-bottom: 30px;
    }
  }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h1>facebook</h1>
      <p>Connect with friends and the world around you on Facebook.</p>
    </div>

    <div class="right">
      <div class="login-box">
        <form>
          <input type="text" placeholder="Email or Phone Number" required />
          <input type="password" placeholder="Password" required />
          <button type="submit" class="login-btn">Log In</button>
          <a href="#" class="forgot">Forgotten password?</a>
          <hr />
          <button type="button" class="create-btn">Create New Account</button>
        </form>
      </div>
      <p class="footer-text"><a href="#">Create a Page</a> for a celebrity, brand or business.</p>
    </div>
  </div>
</body>
</html>
